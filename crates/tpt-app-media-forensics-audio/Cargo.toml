[package]
name = "tpt-app-media-forensics-audio"
description = "Audio analysis: codec, channels, silence, clipping, DC offset, dynamic range, loudness, and spectral measurement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true

[dependencies]
tpt-app-media-forensics-model = { workspace = true }
tpt-av-cadence-core = { workspace = true }
# Royalty-free codecs only. AAC is deliberately absent: like H.264, it is
# covered by patent pools, so its tracks are identified but never decoded.
tpt-av-cadence-opus = { workspace = true }
tpt-av-cadence-vorbis = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The foundation ships an encoder for each codec this crate decodes. Using them
# to build the fixture means the round-trip test exercises a genuinely
# compressed, genuinely Ogg-wrapped stream rather than a hand-written guess at
# one, and it needs no external ffmpeg on the build machine.
tpt-av-cadence-core = { workspace = true }
tpt-av-cadence-opus = { workspace = true }
tpt-av-cadence-vorbis = { workspace = true }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }