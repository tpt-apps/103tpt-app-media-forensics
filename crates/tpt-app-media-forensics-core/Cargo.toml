[package]
name = "tpt-app-media-forensics-core"
description = "Deterministic analysis engine orchestrating container, video, audio, timing, metadata, rules, and evidence for a case."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true

[dependencies]
tpt-app-media-forensics-model = { workspace = true }
tpt-app-media-forensics-container = { workspace = true }
tpt-app-media-forensics-video = { workspace = true }
tpt-app-media-forensics-audio = { workspace = true }
tpt-app-media-forensics-timing = { workspace = true }
tpt-app-media-forensics-metadata = { workspace = true }
tpt-app-media-forensics-evidence = { workspace = true }
tpt-app-media-forensics-report = { workspace = true }
tpt-app-media-forensics-rules = { workspace = true }
tpt-av-cadence-core = { workspace = true }
tpt-av-cadence-wav = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Used only to build fixtures for the audio, A/V, and stage-guard tests. Without
# real encoded streams there is no way to prove those stages run, as opposed to
# silently skipping.
tpt-av-cadence-opus = { workspace = true }
tpt-av-cadence-ogg = { workspace = true }
tpt-av-cadence-core = { workspace = true }
tpt-kinetix-av1 = { workspace = true }
tpt-kinetix-core = { workspace = true }
# Drives the robustness harness in `-core/tests/fuzz.rs`. Arbitrary bytes into
# every reader is the closest thing to coverage-guided fuzzing that runs on a
# machine without clang, and it runs on every build rather than on demand.
proptest = { workspace = true }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
