[package]
name = "tpt-app-media-forensics-timing"
description = "Timestamp forensics: PTS/DTS monotonicity, discontinuities, gaps, overlaps, and A/V sync measurement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true

[dependencies]
tpt-app-media-forensics-model = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The timestamp scanners are pure functions over a slice of times, which is the
# cheapest possible property-test surface — but the properties worth asserting
# are exactly the ones a handful of hand-written cases will never cover, because
# they are statements about *all* sequences (spec §75-§77).
proptest = { workspace = true }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
