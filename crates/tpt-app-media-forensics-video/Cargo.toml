[package]
name = "tpt-app-media-forensics-video"
description = "Video analysis: structure, GOP, frame statistics, duplicate detection, scene changes, and colour."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true

[dependencies]
tpt-kinetix-core = { workspace = true }
tpt-kinetix-vp9 = { workspace = true }
tpt-kinetix-av1 = { workspace = true }
tpt-app-media-forensics-model = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The foundation ships an AV1 encoder backed by rav1e. Using it to build the
# fixture is what makes a genuine end-to-end Tier-2 test possible on a machine
# with no ffmpeg: real AV1 frames are encoded, wrapped in a real WebM container,
# read back through the demuxer, and decoded by the Tier-2 path.
#
# VP9 has no encoder upstream, so VP9 remains structurally tested only.
tpt-kinetix-av1 = { workspace = true }
# Used only by the fixture builder in `-container`, which needs to declare a
# real `V_AV1` track.
tpt-app-media-forensics-container = { workspace = true }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }